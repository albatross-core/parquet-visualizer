name: Bug Report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open a Parquet file with ..., the table shows ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Drop a file with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: file-details
    attributes:
      label: Parquet file details
      description: If possible, describe the file (size, compression, column types, which writer produced it). Please do not attach files containing sensitive data.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 138, Firefox 141
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Any errors shown in the browser devtools console.
      render: text
